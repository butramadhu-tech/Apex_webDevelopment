<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernSite | Contact</title>
    <meta name="description" content="Contact ModernSite for your digital needs.">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .contact-info {
            text-align: center;
            margin-bottom: 3rem;
        }
        .contact-info p {
            color: var(--text-light);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container flex">
            <div class="logo">ModernSite</div>
            <nav>
                <ul class="nav-links flex">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="contact-section">
            <div class="container">
                <div class="contact-info">
                    <h2>Get In Touch</h2>
                    <p>Have a project in mind or want to learn more about our services? Send us a message!</p>
                </div>
                
                <form action="#" method="POST" class="contact-form">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe">
                    </div>
                    
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" required placeholder="john@example.com">
                    </div>
                    
                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject" style="padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: var(--border-radius); font-family: inherit;">
                            <option value="general">General Inquiry</option>
                            <option value="project">New Project</option>
                            <option value="support">Support</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" required placeholder="Your message here..."></textarea>
                    </div>
                    
                    <button type="submit" class="btn">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <h3>ModernSite</h3>
            <p>&copy; 2026 ModernSite. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
