<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernSite | Weather App</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo"><i class="fas fa-rocket"></i> ModernSite</div>
            <nav aria-label="Main Navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="weather.html" class="active">Weather</a></li>
                    <li><a href="todo.html">To-Do</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode"><i class="fas fa-moon"></i></button>
                <button class="hamburger" aria-label="Open Mobile Menu"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main class="animated-bg section-padding" style="min-height: 85vh;">
        <div class="container">
            <div class="glass-card weather-app reveal">
                <h2><i class="fas fa-cloud-sun"></i> Weather App</h2>
                <div class="search-box" style="margin-top: 2rem;">
                    <input type="text" id="city-input" placeholder="Enter city name..." autocomplete="off">
                    <button id="search-btn"><i class="fas fa-search"></i></button>
                </div>

                <div id="loading" class="spinner hidden"></div>
                
                <div id="error-message" class="hidden" style="color: var(--danger); margin-bottom: 1rem; font-weight: 500;"></div>

                <div id="weather-info" class="weather-details hidden">
                    <h2 id="city-name">--</h2>
                    <div class="temp-box">
                        <img id="weather-icon" src="" alt="Weather Icon">
                        <h1 id="temp">--°C</h1>
                    </div>
                    <p id="description" style="text-transform: capitalize; font-size: 1.25rem;">--</p>
                    
                    <div class="weather-meta">
                        <div>
                            <i class="fas fa-tint" style="color: #3b82f6; font-size: 1.5rem;"></i>
                            <p id="humidity" style="font-weight: 600; font-size: 1.25rem;">--%</p>
                            <p style="font-size: 0.85rem;">Humidity</p>
                        </div>
                        <div>
                            <i class="fas fa-wind" style="color: #94a3b8; font-size: 1.5rem;"></i>
                            <p id="wind" style="font-weight: 600; font-size: 1.25rem;">-- km/h</p>
                            <p style="font-size: 0.85rem;">Wind Speed</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <h3>ModernSite</h3>
            <p>&copy; 2026 ModernSite Internship Project.</p>
        </div>
    </footer>

    <script src="js/main.js" defer></script>
    <script src="js/weather.js" defer></script>
</body>
</html>
