<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ModernSite | Contact</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="container">
            <div class="logo"><i class="fas fa-rocket"></i> ModernSite</div>
            <nav aria-label="Main Navigation">
                <ul class="nav-links">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="weather.html">Weather</a></li>
                    <li><a href="todo.html">To-Do</a></li>
                    <li><a href="contact.html" class="active">Contact</a></li>
                </ul>
            </nav>
            <div class="nav-actions">
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle Dark Mode"><i class="fas fa-moon"></i></button>
                <button class="hamburger" aria-label="Open Mobile Menu"><span></span><span></span><span></span></button>
            </div>
        </div>
    </header>

    <main class="animated-bg section-padding" style="min-height: 85vh;">
        <div class="container">
            <div class="glass-card reveal" style="max-width: 600px; margin: 0 auto;">
                <h2 style="text-align: center;"><i class="fas fa-envelope"></i> Get In Touch</h2>
                <p style="text-align: center; color: var(--text-dark); margin-bottom: 2rem;">We'd love to hear from you. Fill out the form below.</p>
                
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Full Name</label>
                        <input type="text" id="name" name="name" required placeholder="John Doe">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="4" required placeholder="Your message here..."></textarea>
                    </div>
                    <button type="submit" class="btn" style="width: 100%; justify-content: center;"><i class="fas fa-paper-plane"></i> Send Message</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <h3>ModernSite</h3>
            <p>&copy; 2026 ModernSite Internship Project.</p>
        </div>
    </footer>

    <script src="js/main.js" defer></script>
</body>
</html>
